name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate source files and version
        run: |
          node --check public/assets/common.js
          node --check public/assets/site.js
          node --check public/assets/admin.js
          node -e "const fs=require('node:fs'); const v=fs.readFileSync('version','utf8').trim(); if(!/^\\d+\\.\\d+\\.\\d+$/.test(v)) process.exit(1)"
      - name: Build site
        run: npm run build
